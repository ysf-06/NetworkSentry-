name: NetworkSentry CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  linux-and-windows-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies for headless Qt and GCC
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build & test Native C Packet Engine (Linux)
        if: runner.os == 'Linux'
        working-directory: src/native
        run: |
          make test

      - name: Run pytest suite (including Linux /proc/net/route & offline route tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v
