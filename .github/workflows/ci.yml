name: NetworkSentry CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  linux-and-windows-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies for headless Qt and GCC
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency security vulnerability scan (pip-audit)
        run: |
          pip-audit

      - name: Code quality & linting (ruff)
        run: |
          ruff check src/ tests/

      - name: Static type checking (mypy)
        run: |
          mypy src/ tests/

      - name: Build & test Native C Packet Engine (Linux)
        if: runner.os == 'Linux'
        working-directory: src/native
        run: |
          make test

      - name: Build Native C Packet Engine (Windows)
        if: runner.os == 'Windows'
        run: |
          gcc -O3 -shared -Wall -Wextra -Werror -o src/native/packet_parser.dll src/native/src/packet_parser.c

      - name: Localhost port scanner verification (self-contained integration test)
        run: |
          pytest -v tests/test_localhost_verification.py

      - name: Run full pytest test suite with test coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v --cov=src --cov-report=term --cov-report=xml

