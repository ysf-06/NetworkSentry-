[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = [
    "build",
    "dist",
    ".venv",
]
